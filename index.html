
<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DEVARAB | Offensive Security & Advanced Intel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
      :root {
        --neon-red: #ff0000;
        --dark-bg: #050505;
        --glass-bg: rgba(10, 10, 10, 0.7);
        --accent-glow: rgba(220, 38, 38, 0.15);
      }
      body {
        font-family: 'IBM Plex Sans Arabic', sans-serif;
        background-color: var(--dark-bg);
        overflow-x: hidden;
        color: #f1f5f9;
        margin: 0;
      }
      .mono {
        font-family: 'JetBrains Mono', monospace;
      }

      /* Advanced Cyber Background */
      .cyber-bg {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: -1;
        background: radial-gradient(circle at 50% 50%, #1a0000 0%, #050505 100%);
        overflow: hidden;
      }

      .cyber-bg::before {
        content: "";
        position: absolute;
        width: 200%;
        height: 200%;
        top: -50%;
        left: -50%;
        background-image: 
          radial-gradient(var(--accent-glow) 1px, transparent 1px);
        background-size: 40px 40px;
        transform: rotate(15deg);
        animation: drift 120s linear infinite;
      }

      @keyframes drift {
        from { transform: rotate(15deg) translate(0, 0); }
        to { transform: rotate(15deg) translate(40px, 40px); }
      }

      /* Animated Tech Mesh */
      .tech-mesh {
        position: fixed;
        inset: 0;
        background: 
          linear-gradient(90deg, rgba(220, 38, 38, 0.02) 1px, transparent 1px),
          linear-gradient(rgba(220, 38, 38, 0.02) 1px, transparent 1px);
        background-size: 100px 100px;
        z-index: -1;
        mask-image: radial-gradient(ellipse at 50% 50%, black 20%, transparent 80%);
      }

      /* Glassmorphism Classes */
      .glass-panel {
        background: var(--glass-bg);
        backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.05);
        box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.8);
      }

      .glass-border-red {
        border: 1px solid rgba(220, 38, 38, 0.2);
        box-shadow: inset 0 0 15px rgba(220, 38, 38, 0.05);
      }

      /* Scanline & Noise */
      .scanline {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(
          to bottom,
          rgba(18, 16, 16, 0) 50%,
          rgba(0, 0, 0, 0.2) 50%
        );
        background-size: 100% 4px;
        z-index: 1000;
        pointer-events: none;
        opacity: 0.3;
      }

      /* Modern Scrollbar */
      ::-webkit-scrollbar { width: 4px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { 
        background: linear-gradient(to bottom, transparent, #dc2626, transparent);
        border-radius: 10px;
      }

      /* Animations */
      @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-10px); }
      }
      .animate-float { animation: float 6s ease-in-out infinite; }

      .glow-text {
        text-shadow: 0 0 10px rgba(220, 38, 38, 0.5);
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body>
    <div class="cyber-bg"></div>
    <div class="tech-mesh"></div>
    <div class="scanline"></div>
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
